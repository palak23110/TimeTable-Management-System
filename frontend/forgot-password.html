<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1c2946"><title>Forgot password | BMU TTMS</title><link rel="stylesheet" href="/css/styles.css"><script src="/js/forgot-password.js" defer></script></head>
<body class="simple-page"><main class="simple-auth"><a class="simple-brand" href="/">BMU <span>Timetable Management System</span></a><section class="simple-card"><header class="auth-heading"><h1>Forgot password?</h1><p>Enter your registered email and we’ll send a reset link if an account matches.</p></header><form id="forgot-form" novalidate><label class="field"><span>Registered email <b>*</b></span><input name="email" type="email" autocomplete="email" placeholder="you@bmu.edu" maxlength="254" required></label><p class="form-message" id="forgot-message" aria-live="polite"></p><button class="submit-button" type="submit">Send reset link</button></form><a class="back-link" href="/login">← Back to sign in</a></section></main></body></html>
