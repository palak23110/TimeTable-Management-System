<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1c2946">
    <title>Teacher invitation | BMU TTMS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/invitation.js" defer></script>
  </head>
  <body class="simple-page">
    <main class="simple-auth">
      <div class="simple-brand">BMU <span>Timetable Management System</span></div>
      <section class="simple-card">
        <header class="auth-heading">
          <h1>Teacher invitation</h1>
          <p>Choose whether to accept this invitation to BMU TTMS.</p>
        </header>
        <div class="invitation-actions">
          <button class="submit-button" type="button" data-accept-invitation>Accept Invitation</button>
          <button class="submit-button" type="button" data-reject-invitation>Reject Invitation</button>
        </div>
        <p class="form-message" data-invitation-message role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
