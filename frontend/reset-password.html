<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1c2946"><title>Reset password | BMU TTMS</title><link rel="stylesheet" href="/css/styles.css"><script src="/js/reset-password.js" defer></script></head>
<body class="simple-page"><main class="simple-auth"><a class="simple-brand" href="/">BMU <span>Timetable Management System</span></a><section class="simple-card"><header class="auth-heading"><h1>Choose a new password</h1><p>Set a strong password for your BMU TTMS account.</p></header><form id="reset-form" novalidate><label class="field"><span>New password <b>*</b></span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label class="field"><span>Confirm password <b>*</b></span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><p class="password-hint">Use at least 8 characters.</p><p class="form-message" id="reset-message" aria-live="polite"></p><button class="submit-button" type="submit">Set new password</button></form><a class="back-link" href="/login">← Back to sign in</a></section></main></body></html>
